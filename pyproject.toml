[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-eval"
version = "0.1.0"
description = "Evaluate, optimize and budget LLM token usage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tiktoken>=0.7",
    "anthropic>=0.40",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
token-eval = "token_eval.cli:app"

[tool.setuptools]
packages = ["token_eval"]

[tool.setuptools.package-data]
token_eval = ["pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
